# keyboard
repeat_rate=25
repeat_delay=600
numlock_on=0
xkb_rules_layout=us

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=1
device_rule=type:trackpad,disable_while_typing:1
device_rule=type:pointer,middle_button_emulation:1
swipe_min_threshold=1

# 3-finger: Window focus
gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down


# --- Mouse & Trackpad Pointer Settings ---
mouse_accel_speed = 0.9
mouse_accel_profile = 1        # Set to 1 (flat) to remove slow-drag dampening
mouse_natural_scrolling = 0

# --- Per-Device Overrides ---
device_rule = name:ELAN0676:00 04F3:3195 Touchpad,accel_profile:1,accel_speed:0.9

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0


drag_tile_to_tile=1
