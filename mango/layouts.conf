
circle_layout=dwindle,scroller,vertical_scroller,center_tile,tile,monocle,deck

tab_bar_height = 0

scratchpad_cross_monitor=1

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.15,0.3,0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=1
default_master_factor = 0.75
# nmaster=1
smart_gaps=0
center_when_single_stack=0
center_master_overspread=1

# Overview Setting
hotarea_size=15
enable_hotarea=1
hotarea_corner=0
bind=Super,Tab,overcircle,next
overview_gap_inner=5
overview_gap_outer=30

# dwindle settings
dwindle_split_ratio=0.5
dwindle_smart_split=0
dwindle_horizontal_split=0
dwindle_vertical_split=0
dwindle_preserve_split=1
dwindle_smart_resize=0
dwindle_drop_simple_split=0

# set default layouts for each tag
tag_rule=id:1,layout_name:dwindle,
tag_rule=id:2,layout_name:dwindle,
tag_rule=id:3,layout_name:dwindle,
tag_rule=id:4,layout_name:dwindle,
tag_rule=id:5,layout_name:dwindle,
tag_rule=id:6,layout_name:dwindle,
tag_rule=id:7,layout_name:dwindle,
tag_rule=id:8,layout_name:dwindle,
tag_rule=id:9,layout_name:deck,


#tab grups
monocle_tab_mode=1
# Example monocle configuration
monocle_right_button_close=1z
monocle_no_border=1
monocle_no_gap=1


#deck tab
deck_tab_mode=1
