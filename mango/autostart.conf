# background processes
exec_once=/usr/lib/xdg-desktop-portal -r -v

## start a polkit agent
exec_once=systemctl --user start hyprpolkitagent

## start nautilus in the background
exec_once=nautilus --gapplication-service

## opentabletdriver
exec_once=systemctl --user start opentabletdriver

## start DankMaterial Shell
exec_once=dms run

# UI
exec_once=ghostty

# pre-load terminal scratchpad
exec_once=mmsg dispatch toggle_named_scratchpad,com.mitchellh.ghostty,scratchpad-term,'ghostty +new-window --title="scratchpad-term"'
exec_once=kdeconnectd

