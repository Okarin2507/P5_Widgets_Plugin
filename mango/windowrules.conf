window_rule=title:Floating-Menu,is_floating:1,height:0.4,width:0.4

window_rule=app_id:brave,focused_opacity:0.95,unfocused_opacity:0.85
# Add to ~/.config/mango/config or ~/.config/mangowm/config
window_rule=no_border:1,no_radius:1,app_id:brave-browser

window_rule=app_id:virt-manager,focused_opacity:1,unfocused_opacity:1

# fix some issues with warframe not capturing mouse.
window_rule=app_id:broken,focused_opacity:1,unfocused_opacity:1,is_fullscreen:1,monitor:HDMI-A-1

layer_rule=layer_name:^dms.*,animation_type_open:fade,animation_type_close:fade
layer_rule=layer_name:^waybar.*,animation_type_open:slide,animation_type_close:fade

window_rule=app_id:glyphs,is_overlay:1,width:1920,height:1080,is_floating:1,focused_opacity:0.5,unfocused_opacity:0.5

# Brave Picture-in-Picture Rules
window_rule = is_floating:1, title:Picture-in-picture
window_rule = width:0.25, height:0.25, title:Picture-in-picture
